<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oracle Console</title>
<style>
  :root {
    --bg: #0f1412; --panel: #151d1a; --line: #24302b;
    --ink: #e7f2ec; --dim: #8aa39a; --mint: #7fe3c4; --mint-ink: #06110d;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
  }
  header {
    padding: 18px 20px; border-bottom: 1px solid var(--line);
    display: flex; align-items: baseline; gap: 12px;
  }
  header h1 { margin: 0; font-size: 18px; letter-spacing: .3px; }
  header h1 b { color: var(--mint); }
  header span { color: var(--dim); font-size: 13px; }
  main { max-width: 860px; margin: 0 auto; padding: 20px 16px 60px; }
  .tasks { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
  .tasks button {
    background: var(--panel); color: var(--dim); border: 1px solid var(--line);
    border-radius: 999px; padding: 6px 14px; cursor: pointer; font-size: 13px;
  }
  .tasks button.on { background: var(--mint); color: var(--mint-ink); border-color: var(--mint); font-weight: 600; }
  label { display: block; color: var(--dim); font-size: 12px; margin: 12px 0 5px; }
  input, textarea {
    width: 100%; background: var(--panel); color: var(--ink);
    border: 1px solid var(--line); border-radius: 10px; padding: 11px 13px;
    font-size: 14px; resize: vertical;
  }
  textarea { font-family: var(--mono); min-height: 150px; }
  input { font-size: 15px; }
  .row { display: flex; gap: 10px; align-items: center; margin-top: 14px; }
  .go {
    background: var(--mint); color: var(--mint-ink); border: 0; font-weight: 600;
    border-radius: 10px; padding: 11px 22px; cursor: pointer; font-size: 15px;
  }
  .go:disabled { opacity: .5; cursor: default; }
  .hint { color: var(--dim); font-size: 12px; }
  .out {
    margin-top: 22px; background: var(--panel); border: 1px solid var(--line);
    border-radius: 12px; padding: 16px 18px; white-space: pre-wrap;
    font-family: var(--mono); font-size: 13.5px; min-height: 40px; display: none;
  }
  .out.show { display: block; }
  .err { color: #ff9b8a; }
  footer { color: var(--dim); font-size: 12px; text-align: center; padding: 20px; }
  footer code { color: var(--ink); }
</style>
</head>
<body>
  <header>
    <h1><b>Oracle</b> Console</h1>
    <span>a self-hosted coder, running through Twill</span>
  </header>
  <main>
    <div class="tasks" id="tasks"></div>

    <label id="promptLabel" for="prompt">Request</label>
    <input id="prompt" placeholder="What do you want?" autocomplete="off">

    <label id="codeLabel" for="code">Code (optional context)</label>
    <textarea id="code" placeholder="Paste code here for explain, review, fix, tests..."></textarea>

    <div class="row">
      <button class="go" id="go">Run</button>
      <span class="hint" id="hint"></span>
    </div>

    <div class="out" id="out"></div>
  </main>
  <footer>
    Runs locally on your machine. Each answer reloads the model, so give it a
    moment. Start with <code>oracle serve</code>.
  </footer>

<script>
  // Each task says how to label the two inputs and whether it wants code.
  const TASKS = {
    code:    { label: "Ask about code",  prompt: "What should it do?",              needsCode: false, promptName: "Request" },
    explain: { label: "Explain",         prompt: "Anything to focus on? (optional)", needsCode: true,  promptName: "Guidance" },
    review:  { label: "Review",          prompt: "Anything to focus on? (optional)", needsCode: true,  promptName: "Guidance" },
    fix:     { label: "Fix a bug",       prompt: "The error or symptom (optional)",  needsCode: true,  promptName: "Error" },
    tests:   { label: "Write tests",     prompt: "Anything to focus on? (optional)", needsCode: true,  promptName: "Guidance" },
    sh:      { label: "Shell command",   prompt: "What should the command do?",      needsCode: false, promptName: "Request" },
    commit:  { label: "Commit message",  prompt: "",                                 needsCode: true,  promptName: "Guidance", codeName: "Diff" },
  };

  let current = "code";
  const el = id => document.getElementById(id);

  const tasksBox = el("tasks");
  Object.keys(TASKS).forEach(name => {
    const b = document.createElement("button");
    b.textContent = TASKS[name].label;
    b.dataset.task = name;
    b.onclick = () => select(name);
    tasksBox.appendChild(b);
  });

  function select(name) {
    current = name;
    const t = TASKS[name];
    [...tasksBox.children].forEach(b => b.classList.toggle("on", b.dataset.task === name));
    el("promptLabel").textContent = t.promptName;
    el("prompt").placeholder = t.prompt || "(not needed for this task)";
    el("codeLabel").textContent = t.codeName || (t.needsCode ? "Code" : "Code (optional context)");
    el("code").style.display = "block";
  }

  async function run() {
    const task = current;
    const prompt = el("prompt").value.trim();
    const code = el("code").value;
    if (!prompt && !code.trim()) { flash("Give a request or paste some code."); return; }
    const out = el("out");
    el("go").disabled = true;
    el("hint").textContent = "thinking...";
    out.className = "out show";
    out.textContent = "";
    try {
      const res = await fetch("/run", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ task, prompt, code }),
      });
      const data = await res.json();
      if (data.error && !data.reply) {
        out.innerHTML = '<span class="err">' + esc(data.error) + "</span>";
      } else {
        out.textContent = data.reply || "(no output)";
      }
    } catch (e) {
      out.innerHTML = '<span class="err">request failed: ' + esc(String(e)) + "</span>";
    } finally {
      el("go").disabled = false;
      el("hint").textContent = "";
    }
  }

  function esc(s) { return s.replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c])); }
  function flash(msg) { const h = el("hint"); h.textContent = msg; setTimeout(() => h.textContent = "", 2500); }

  el("go").onclick = run;
  // Cmd/Ctrl-Enter runs from either field.
  document.addEventListener("keydown", e => {
    if ((e.metaKey || e.ctrlKey) && e.key === "Enter") run();
  });
  select("code");
</script>
</body>
</html>
