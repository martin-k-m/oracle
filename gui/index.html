<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oracle Console</title>
<style>
  :root {
    --bg: #0f1412; --panel: #151d1a; --panel2: #1b2621; --line: #24302b;
    --ink: #e7f2ec; --dim: #8aa39a; --mint: #7fe3c4; --mint-ink: #06110d;
    --user: #21302a; --err: #ff9b8a;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.55 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    display: flex; flex-direction: column;
  }
  header {
    padding: 14px 20px; border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 12px;
  }
  header h1 { margin: 0; font-size: 17px; letter-spacing: .3px; }
  header h1 b { color: var(--mint); }
  header .sub { color: var(--dim); font-size: 13px; }
  header .spacer { flex: 1; }
  header button.ghost, header select.ghost {
    background: transparent; color: var(--dim); border: 1px solid var(--line);
    border-radius: 8px; padding: 6px 12px; cursor: pointer; font-size: 13px;
  }
  header select.ghost { display: none; }
  header select.ghost.show { display: inline-block; }
  .chips { display: flex; flex-wrap: wrap; gap: 7px; padding: 12px 20px 0; }
  .chips button {
    background: var(--panel); color: var(--dim); border: 1px solid var(--line);
    border-radius: 999px; padding: 5px 13px; cursor: pointer; font-size: 13px;
  }
  .chips button.on { background: var(--mint); color: var(--mint-ink); border-color: var(--mint); font-weight: 600; }
  main {
    flex: 1; overflow-y: auto; padding: 16px 20px 8px;
    max-width: 900px; width: 100%; margin: 0 auto;
  }
  .msg { margin: 12px 0; display: flex; gap: 10px; }
  .msg .who {
    flex: 0 0 62px; color: var(--dim); font-size: 12px; padding-top: 3px; text-transform: uppercase; letter-spacing: .5px;
  }
  .msg .body {
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    padding: 11px 14px; white-space: pre-wrap; word-wrap: break-word;
    font-family: var(--mono); font-size: 13.5px; flex: 1; min-width: 0;
  }
  .msg.user .body { background: var(--user); }
  .msg.err .body { color: var(--err); }
  .cursor::after { content: "\2588"; color: var(--mint); animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .empty { color: var(--dim); text-align: center; margin-top: 40px; font-size: 14px; }
  footer {
    border-top: 1px solid var(--line); padding: 12px 20px 16px;
    max-width: 900px; width: 100%; margin: 0 auto;
  }
  #codeWrap { display: none; margin-bottom: 8px; }
  #codeWrap.show { display: block; }
  #code {
    width: 100%; background: var(--panel); color: var(--ink);
    border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px;
    font-family: var(--mono); font-size: 13px; min-height: 96px; resize: vertical;
  }
  .inrow { display: flex; gap: 10px; align-items: flex-end; }
  #prompt {
    flex: 1; background: var(--panel); color: var(--ink);
    border: 1px solid var(--line); border-radius: 10px; padding: 11px 13px;
    font-size: 15px; resize: none; min-height: 46px; max-height: 180px; font-family: inherit;
  }
  .go {
    background: var(--mint); color: var(--mint-ink); border: 0; font-weight: 600;
    border-radius: 10px; padding: 12px 20px; cursor: pointer; font-size: 15px; height: 46px;
  }
  .go:disabled { opacity: .5; cursor: default; }
  .tip { color: var(--dim); font-size: 12px; margin-top: 7px; }
  .tip code { color: var(--ink); }
  .opts { display: flex; align-items: center; gap: 16px; margin-top: 9px; flex-wrap: wrap; }
  .opts label { color: var(--dim); font-size: 12px; display: flex; align-items: center; gap: 6px; }
  .opts select {
    background: var(--panel); color: var(--ink); border: 1px solid var(--line);
    border-radius: 7px; padding: 3px 7px; font-size: 12px;
  }
  .opts .tip { margin: 0; margin-left: auto; }
</style>
</head>
<body>
  <header>
    <h1><b>Oracle</b> Console</h1>
    <span class="sub">self-hosted coder, model held live</span>
    <span class="spacer"></span>
    <select class="ghost" id="model" title="Model"></select>
    <button class="ghost" id="reset">New conversation</button>
  </header>
  <div class="chips" id="chips"></div>
  <main id="transcript">
    <div class="empty" id="empty">Ask anything, or pick a tool above. Replies stream as the model writes them.</div>
  </main>
  <footer>
    <div id="codeWrap"><textarea id="code" placeholder="Paste code here as context..."></textarea></div>
    <div class="inrow">
      <textarea id="prompt" rows="1" placeholder="Message Oracle..."></textarea>
      <button class="go" id="go">Send</button>
    </div>
    <div class="opts">
      <label>Style
        <select id="temp">
          <option value="0.1">Precise</option>
          <option value="0.3" selected>Balanced</option>
          <option value="0.7">Creative</option>
        </select>
      </label>
      <label>Length
        <select id="steps">
          <option value="120">Short</option>
          <option value="280" selected>Medium</option>
          <option value="512">Long</option>
        </select>
      </label>
      <span class="tip">Enter sends, Shift-Enter for a newline. Tools run one-shot; Chat keeps context.</span>
    </div>
  </footer>

<script>
  const TASKS = {
    chat:    { label: "Chat",           code: false, ph: "Message Oracle..." },
    code:    { label: "Write code",     code: false, ph: "Describe what to write..." },
    explain: { label: "Explain",        code: true,  ph: "Anything to focus on? (optional)" },
    review:  { label: "Review",         code: true,  ph: "Anything to focus on? (optional)" },
    fix:     { label: "Fix a bug",      code: true,  ph: "The error or symptom (optional)" },
    tests:   { label: "Write tests",    code: true,  ph: "Anything to focus on? (optional)" },
    sh:      { label: "Shell command",  code: false, ph: "What should the command do?" },
    commit:  { label: "Commit message", code: true,  ph: "Paste a diff below; guidance optional" },
  };

  let task = "chat";
  let busy = false;
  const el = id => document.getElementById(id);
  const transcript = el("transcript");

  const chips = el("chips");
  Object.keys(TASKS).forEach(name => {
    const b = document.createElement("button");
    b.textContent = TASKS[name].label;
    b.dataset.task = name;
    b.onclick = () => pick(name);
    chips.appendChild(b);
  });

  function pick(name) {
    task = name;
    [...chips.children].forEach(b => b.classList.toggle("on", b.dataset.task === name));
    el("codeWrap").classList.toggle("show", TASKS[name].code);
    el("prompt").placeholder = TASKS[name].ph;
    el("prompt").focus();
  }

  function clearTranscript() {
    transcript.innerHTML = "";
  }

  function addMsg(who, text, cls) {
    const empty = el("empty");
    if (empty) empty.remove();
    const wrap = document.createElement("div");
    wrap.className = "msg " + (cls || "");
    const w = document.createElement("div");
    w.className = "who"; w.textContent = who;
    const body = document.createElement("div");
    body.className = "body"; body.textContent = text;
    wrap.append(w, body);
    transcript.appendChild(wrap);
    transcript.scrollTop = transcript.scrollHeight;
    return body;
  }

  async function send() {
    if (busy) return;
    const prompt = el("prompt").value.trim();
    const code = el("code").value;
    if (!prompt && !code.trim()) return;

    // A one-shot tool resets the live conversation, so mirror that by clearing
    // the transcript; chat keeps its history.
    if (task !== "chat") clearTranscript();

    const label = task === "chat" ? prompt : (TASKS[task].label + (prompt ? ": " + prompt : ""));
    addMsg(task === "chat" ? "you" : task, label || "(code)", "user");
    el("prompt").value = "";
    autosize();
    const out = addMsg("oracle", "", "");
    out.classList.add("cursor");

    busy = true; el("go").disabled = true;
    try {
      const res = await fetch("/stream", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ task, prompt, code, temp: el("temp").value, steps: el("steps").value }),
      });
      if (!res.ok || !res.body) {
        const d = await res.json().catch(() => ({ error: "request failed" }));
        out.classList.remove("cursor");
        out.parentElement.classList.add("err");
        out.textContent = d.error || "request failed";
        return;
      }
      const reader = res.body.getReader();
      const dec = new TextDecoder();
      let buf = "";
      let got = false;
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += dec.decode(value, { stream: true });
        let i;
        while ((i = buf.indexOf("\n\n")) >= 0) {
          const chunk = buf.slice(0, i); buf = buf.slice(i + 2);
          if (chunk.startsWith("event: done")) continue;
          const line = chunk.split("\n").find(l => l.startsWith("data: "));
          if (!line) continue;
          try {
            const obj = JSON.parse(line.slice(6));
            if (obj.t) { out.textContent += obj.t; got = true; transcript.scrollTop = transcript.scrollHeight; }
          } catch (e) { /* ignore a partial frame */ }
        }
      }
      if (!got) out.textContent = "(no output)";
    } catch (e) {
      out.parentElement.classList.add("err");
      out.textContent = "request failed: " + e;
    } finally {
      out.classList.remove("cursor");
      busy = false; el("go").disabled = false;
      el("prompt").focus();
    }
  }

  async function reset() {
    await fetch("/reset", { method: "POST" }).catch(() => {});
    clearTranscript();
    transcript.innerHTML = '<div class="empty" id="empty">New conversation. Ask anything.</div>';
  }

  function autosize() {
    const p = el("prompt");
    p.style.height = "auto";
    p.style.height = Math.min(p.scrollHeight, 180) + "px";
  }

  el("go").onclick = send;
  el("reset").onclick = reset;
  el("prompt").addEventListener("input", autosize);
  el("prompt").addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
  });

  // Populate the model selector from the server. Only offer it when more than
  // one size is installed; a single model needs no switch.
  async function loadModels() {
    try {
      const r = await fetch("/models");
      const d = await r.json();
      const sel = el("model");
      sel.innerHTML = "";
      (d.models || []).forEach(m => {
        const o = document.createElement("option");
        o.value = m; o.textContent = m + (m === "0.5B" ? "" : "");
        if (m === d.current) o.selected = true;
        sel.appendChild(o);
      });
      if ((d.models || []).length > 1) sel.classList.add("show");
      sel.onchange = switchModel;
    } catch (e) { /* server without /models: leave it hidden */ }
  }

  async function switchModel() {
    const sel = el("model");
    const name = sel.value;
    if (busy) { return; }
    busy = true; el("go").disabled = true; sel.disabled = true;
    const note = addMsg("system", "loading " + name + "...", "");
    try {
      const r = await fetch("/model", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name }),
      });
      const d = await r.json();
      note.textContent = r.ok ? ("now using " + (d.current || name) + ". Conversation cleared.") : ("could not switch: " + (d.error || "error"));
    } catch (e) {
      note.textContent = "could not switch: " + e;
    } finally {
      busy = false; el("go").disabled = false; sel.disabled = false;
      el("prompt").focus();
    }
  }

  pick("chat");
  loadModels();
</script>
</body>
</html>
