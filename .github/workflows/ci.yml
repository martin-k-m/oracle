name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: twill check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Install twill
        run: |
          go install github.com/twill-lang/twill/cmd/twill@v1.18.4
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Shape-check every .tw file
        run: |
          twill check src/model.tw src/tokenizer.tw src/quant.tw \
            src/gpt2.tw src/gpt2_tok.tw src/gpt2_quant.tw \
            src/qwen.tw src/qwen_tok.tw src/embed.tw \
            train.tw generate.tw quantize.tw bench.tw \
            gpt2_gen.tw quantize_gpt2.tw qwen_gen.tw chat.tw serve.tw agent.tw \
            tests/tokenizer_test.tw

      - name: Tokenizer round-trip tests
        run: twill run tests/tokenizer_test.tw

      - name: Python retrieval tests
        run: python3 -W error::ResourceWarning -m unittest discover -s tests -p '*_test.py'
