name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract notes for this tag from CHANGELOG
        id: notes
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          # Pull the section for this version out of CHANGELOG.md. The section
          # runs from its own "## [x.y.z]" heading to the next "## " heading.
          awk -v ver="$version" '
            $0 ~ "^## \\[" ver "\\]" { grab = 1; next }
            grab && /^## / { exit }
            grab { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "No CHANGELOG section for $version; using a default note." >&2
            echo "Release $tag." > release-notes.md
          fi

      - name: Build source tarball
        run: |
          tag="${GITHUB_REF_NAME}"
          git archive --format=tar.gz \
            --prefix="oracle-${tag}/" \
            -o "oracle-${tag}-src.tar.gz" "$tag"

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"
          assets=()
          [ -f models/oracle.bin ] && assets+=("models/oracle.bin")
          [ -f models/oracle-int8.bin ] && assets+=("models/oracle-int8.bin")
          assets+=("oracle-${tag}-src.tar.gz")
          gh release create "$tag" \
            --title "$tag" \
            --notes-file release-notes.md \
            "${assets[@]}"
